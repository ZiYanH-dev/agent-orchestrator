# A generic, single database configuration.
#
# [alembic] 完整配置参考: https://alembic.sqlalchemy.org/en/latest/api/config.html
# 连接串在 alembic/env.py 中动态读取 .env 的 DATABASE_URL，此处留占位即可

[alembic]
script_location = alembic
prepend_sys_path = .

# 版本路径
version_path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
